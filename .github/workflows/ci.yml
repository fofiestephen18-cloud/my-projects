# .github/workflows/ci.yml
name: CI

on: [push]                      # the trigger 

jobs:
  build-and-test:
    runs-on: ubuntu-latest      # the runner 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test